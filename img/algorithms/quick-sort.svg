<svg xmlns="http://www.w3.org/2000/svg" width="480" height="428" viewBox="0 0 480 428" role="img" aria-labelledby="title desc">
<title id="title">快排：先划分，再分别排序</title><desc id="desc">基准值 pivot = 2：3, 0, 5, 8, 2, 9, 1, 6, 7, 5；交换 3 与 1：1, 0, 5, 8, 2, 9, 3, 6, 7, 5；交换 5 与 2，完成本层划分：1, 0, 2, 8, 5, 9, 3, 6, 7, 5。递归范围：[0,2] 和 [3,9]。 两边内部仍未有序，划分不等于排序结束。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="428" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">快排：先划分，再分别排序</text><text x="24" y="75" font-size="18" class="" text-anchor="start">基准值 pivot = 2</text><rect x="38.0" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="56.4" y="116" font-size="20" class="" text-anchor="middle">3</text><rect x="78.8" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="97.19999999999999" y="116" font-size="20" class="" text-anchor="middle">0</text><rect x="119.6" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="138.0" y="116" font-size="20" class="" text-anchor="middle">5</text><rect x="160.39999999999998" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="178.79999999999998" y="116" font-size="20" class="" text-anchor="middle">8</text><rect x="201.2" y="90" width="36.8" height="38" rx="6" class="accent"/><text x="219.6" y="116" font-size="20" class="" text-anchor="middle">2</text><rect x="242.0" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="260.4" y="116" font-size="20" class="" text-anchor="middle">9</text><rect x="282.79999999999995" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="301.2" y="116" font-size="20" class="" text-anchor="middle">1</text><rect x="323.59999999999997" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="342.0" y="116" font-size="20" class="" text-anchor="middle">6</text><rect x="364.4" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="382.79999999999995" y="116" font-size="20" class="" text-anchor="middle">7</text><rect x="405.2" y="90" width="36.8" height="38" rx="6" class="cell"/><text x="423.59999999999997" y="116" font-size="20" class="" text-anchor="middle">5</text><text x="24" y="163" font-size="18" class="" text-anchor="start">交换 3 与 1</text><rect x="38.0" y="178" width="36.8" height="38" rx="6" class="accent"/><text x="56.4" y="204" font-size="20" class="" text-anchor="middle">1</text><rect x="78.8" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="97.19999999999999" y="204" font-size="20" class="" text-anchor="middle">0</text><rect x="119.6" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="138.0" y="204" font-size="20" class="" text-anchor="middle">5</text><rect x="160.39999999999998" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="178.79999999999998" y="204" font-size="20" class="" text-anchor="middle">8</text><rect x="201.2" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="219.6" y="204" font-size="20" class="" text-anchor="middle">2</text><rect x="242.0" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="260.4" y="204" font-size="20" class="" text-anchor="middle">9</text><rect x="282.79999999999995" y="178" width="36.8" height="38" rx="6" class="accent"/><text x="301.2" y="204" font-size="20" class="" text-anchor="middle">3</text><rect x="323.59999999999997" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="342.0" y="204" font-size="20" class="" text-anchor="middle">6</text><rect x="364.4" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="382.79999999999995" y="204" font-size="20" class="" text-anchor="middle">7</text><rect x="405.2" y="178" width="36.8" height="38" rx="6" class="cell"/><text x="423.59999999999997" y="204" font-size="20" class="" text-anchor="middle">5</text><text x="24" y="251" font-size="18" class="" text-anchor="start">交换 5 与 2，完成本层划分</text><rect x="38.0" y="266" width="36.8" height="38" rx="6" class="cell"/><text x="56.4" y="292" font-size="20" class="" text-anchor="middle">1</text><rect x="78.8" y="266" width="36.8" height="38" rx="6" class="cell"/><text x="97.19999999999999" y="292" font-size="20" class="" text-anchor="middle">0</text><rect x="119.6" y="266" width="36.8" height="38" rx="6" class="accent"/><text x="138.0" y="292" font-size="20" class="" text-anchor="middle">2</text><rect x="160.39999999999998" y="266" width="36.8" height="38" rx="6" class="cell"/><text x="178.7