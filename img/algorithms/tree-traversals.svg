<svg xmlns="http://www.w3.org/2000/svg" width="480" height="332" viewBox="0 0 480 332" role="img" aria-labelledby="title desc">
<title id="title">记录当前节点的时机不同</title><desc id="desc">前序先记录根，中序在左右子树之间记录根，后序最后记录根。相同颜色标记根8所在的位置。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="332" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">记录当前节点的时机不同</text><text x="24" y="74" font-size="19" class="" text-anchor="start">前序：当前 → 左 → 右</text><rect x="44.0" y="90" width="62" height="38" rx="6" class="accent"/><text x="75.0" y="116" font-size="20" class="" text-anchor="middle">8</text><rect x="110.0" y="90" width="62" height="38" rx="6" class="cell"/><text x="141.0" y="116" font-size="20" class="" text-anchor="middle">3</text><rect x="176.0" y="90" width="62" height="38" rx="6" class="cell"/><text x="207.0" y="116" font-size="20" class="" text-anchor="middle">1</text><rect x="242.0" y="90" width="62" height="38" rx="6" class="cell"/><text x="273.0" y="116" font-size="20" class="" text-anchor="middle">6</text><rect x="308.0" y="90" width="62" height="38" rx="6" class="cell"/><text x="339.0" y="116" font-size="20" class="" text-anchor="middle">10</text><rect x="374.0" y="90" width="62" height="38" rx="6" class="cell"/><text x="405.0" y="116" font-size="20" class="" text-anchor="middle">14</text><text x="24" y="160" font-size="19" class="" text-anchor="start">中序：左 → 当前 → 右</text><rect x="44.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="75.0" y="202" font-size="20" class="" text-anchor="middle">1</text><rect x="110.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="141.0" y="202" font-size="20" class="" text-anchor="middle">3</text><rect x="176.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="207.0" y="202" font-size="20" class="" text-anchor="middle">6</text><rect x="242.0" y="176" width="62" height="38" rx="6" class="accent"/><text x="273.0" y="202" font-size="20" class="" text-anchor="middle">8</text><rect x="308.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="339.0" y="202" font-size="20" class="" text-anchor="middle">10</text><rect x="374.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="405.0" y="202" font-size="20" class="" text-anchor="middle">14</text><text x="24" y="246" font-size="19" class="" text-anchor="start">后序：左 → 右 → 当前</text><rect x="44.0" y="262" width="62" height="38" rx="6" class="cell"/><text x="75.0" y="288" font-size="20" class="" text-anchor="middle">1</text><rect x="110.0" y="262" width="62" height="38" rx="6" class="cell"/><text x="141.0" y="288" font-size="20" class="" text-anchor="middle">6</text><rect x="176.0" y="262" width="62" height="38" rx="6" class="cell"/><text x="207.0" y="288" font-size="20" class="" text-anchor="middle">3</text><rect x="242.0" y="262" width="62" height="38" rx="6" class="cell"/><text x="273.0" y="288" font-size="20" class="" text-anchor="middle">14</text><rect x="308.0" y="262" width="62" height="38" rx="6" class="cell"/><text x="339.0" y="288" font-size="20" class="" text-anchor="middle">10</text><rect x="374.0" y="262" width="62" height="38" rx="6" class="accent"/><text x="405.0" y="288" font-size="20" class="" text-anchor="middle">8</text>
</svg>