<svg xmlns="http://www.w3.org/2000/svg" width="480" height="527" viewBox="0 0 480 527" role="img" aria-labelledby="title desc">
<title id="title">结果保证决定该用哪个函数</title><desc id="desc">sort按分数、用时、编号得到Dave、Bob、Frank、Carol、Alice、Eve；stable_sort仅按分数保持同分原顺序；partial_sort保留有序前三名；nth_element仅保证前三名的人选，不保证内部顺序。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="527" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">结果保证决定该用哪个函数</text><text x="24" y="71" font-size="18" class="" text-anchor="start">sort：分数 ↓、用时 ↑、编号 ↑</text><rect x="26.0" y="91" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="59.666666666666664" y="119" font-size="16" class="" text-anchor="middle">Dave</text><rect x="97.33333333333333" y="91" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="131.0" y="119" font-size="16" class="" text-anchor="middle">Bob</text><rect x="168.66666666666666" y="91" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="202.33333333333331" y="119" font-size="16" class="" text-anchor="middle">Frank</text><rect x="240.0" y="91" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="273.66666666666663" y="119" font-size="16" class="" text-anchor="middle">Carol</text><rect x="311.3333333333333" y="91" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="345.0" y="119" font-size="16" class="" text-anchor="middle">Alice</text><rect x="382.66666666666663" y="91" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="416.3333333333333" y="119" font-size="16" class="" text-anchor="middle">Eve</text><text x="24" y="171" font-size="18" class="" text-anchor="start">stable_sort：只比分数 ↓</text><rect x="26.0" y="191" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="59.666666666666664" y="219" font-size="16" class="" text-anchor="middle">Bob</text><rect x="97.33333333333333" y="191" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="131.0" y="219" font-size="16" class="" text-anchor="middle">Dave</text><rect x="168.66666666666666" y="191" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="202.33333333333331" y="219" font-size="16" class="" text-anchor="middle">Frank</text><rect x="240.0" y="191" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="273.66666666666663" y="219" font-size="16" class="" text-anchor="middle">Alice</text><rect x="311.3333333333333" y="191" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="345.0" y="219" font-size="16" class="" text-anchor="middle">Carol</text><rect x="382.66666666666663" y="191" width="67.33333333333333" height="43" rx="5" class="cell"/><text x="416.3333333333333" y="219" font-size="16" class="" text-anchor="middle">Eve</text><text x="24" y="271" font-size="18" class="" text-anchor="start">partial_sort：只保留前 3 名</text><rect x="26.0" y="291" width="138.66666666666666" height="43" rx="5" class="accent"/><text x="95.33333333333333" y="319" font-size="20" class="" text-anchor="middle">Dave</text><rect x="168.66666666666666" y="291" width="138.66666666666666" height="43" rx="5" class="accent"/><text x="238.0" y="319" font-size="20" class="" text-anchor="middle">Bob</text><rect x="311.3333333333333" y="291" width="138.66666666666666" height="43" rx="5" class="accent"/><text x="380.66666666666663" y="319" font-size="20" class="" text-anchor="middle">Frank</text><text x="24" y="371" font-size="18" class="" text-anchor="start">nth_element：前 3 名只保证人选</text><rect x="26" y="391" width="428" height="43" rx="8" class="accent"/><text x="240" y="419" font-size="21" class="" text-anchor="middle">{ Dave, Bob, Frank }</text><text x="24" y="477" font-size="18" class="muted" text-anchor="start">花括号表示集合，图中列出的先后不作保证。</text>
</svg>