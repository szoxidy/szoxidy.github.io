<svg xmlns="http://www.w3.org/2000/svg" width="480" height="465" viewBox="0 0 480 465" role="img" aria-labelledby="title desc">
<title id="title">按权重选边，连接不同集合</title><desc id="desc">四个顶点的五条边。按权重选择0—2(1)、1—2(2)、2—3(3)，形成总权重6的最小生成树。边0—1(4)和1—3(5)会成环。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="465" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">按权重选边，连接不同集合</text><path d="M100,100 L360,100" class="edge"/><text x="230" y="86" font-size="19" class="heading" text-anchor="start">4</text><path d="M100,100 L100,270" class="route"/><text x="72" y="192" font-size="19" class="heading" text-anchor="start">1</text><path d="M360,100 L100,270" class="route"/><text x="215" y="170" font-size="19" class="heading" text-anchor="start">2</text><path d="M360,100 L360,270" class="edge"/><text x="385" y="195" font-size="19" class="heading" text-anchor="start">5</text><path d="M100,270 L360,270" class="route"/><text x="230" y="258" font-size="19" class="heading" text-anchor="start">3</text><circle cx="100" cy="100" r="23" class="cell"/><text x="100" y="107" font-size="22" class="" text-anchor="middle">0</text><circle cx="360" cy="100" r="23" class="cell"/><text x="360" y="107" font-size="22" class="" text-anchor="middle">1</text><circle cx="100" cy="270" r="23" class="cell"/><text x="100" y="277" font-size="22" class="" text-anchor="middle">2</text><circle cx="360" cy="270" r="23" class="cell"/><text x="360" y="277" font-size="22" class="" text-anchor="middle">3</text><text x="24" y="335" font-size="18" class="muted" text-anchor="start">① 选 0—2：权重 1</text><text x="24" y="362" font-size="18" class="muted" text-anchor="start">② 选 1—2：权重 2</text><text x="24" y="389" font-size="18" class="muted" text-anchor="start">③ 选 2—3：权重 3</text><text x="24" y="416" font-size="18" class="muted" text-anchor="start">已选 3 条边，总权重 6。</text>
</svg>