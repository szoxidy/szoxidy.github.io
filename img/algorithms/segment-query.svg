<svg xmlns="http://www.w3.org/2000/svg" width="480" height="365" viewBox="0 0 480 365" role="img" aria-labelledby="title desc">
<title id="title">把查询 [2,5] 拆成完整节点</title><desc id="desc">线段树根区间[1,8]，查询[2,5]时取[2,2]、[3,4]、[5,5]，其余节点无交集或需要继续拆分。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="365" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">把查询 [2,5] 拆成完整节点</text><path d="M240,86 L120,164" class="edge"/><path d="M240,86 L360,164" class="edge"/><path d="M120,164 L70,242" class="edge"/><path d="M120,164 L180,242" class="edge"/><path d="M360,164 L315,242" class="edge"/><path d="M360,164 L415,242" class="edge"/><path d="M70,242 L80,308" class="edge"/><path d="M315,242 L295,308" class="edge"/><rect x="201" y="68" width="78" height="36" rx="6" class="cell"/><text x="240" y="93" font-size="17" class="" text-anchor="middle">[1,8]</text><rect x="81" y="146" width="78" height="36" rx="6" class="cell"/><text x="120" y="171" font-size="17" class="" text-anchor="middle">[1,4]</text><rect x="321" y="146" width="78" height="36" rx="6" class="cell"/><text x="360" y="171" font-size="17" class="" text-anchor="middle">[5,8]</text><rect x="31" y="224" width="78" height="36" rx="6" class="cell"/><text x="70" y="249" font-size="17" class="" text-anchor="middle">[1,2]</text><rect x="141" y="224" width="78" height="36" rx="6" class="accent"/><text x="180" y="249" font-size="17" class="" text-anchor="middle">[3,4]</text><rect x="276" y="224" width="78" height="36" rx="6" class="cell"/><text x="315" y="249" font-size="17" class="" text-anchor="middle">[5,6]</text><rect x="376" y="224" width="78" height="36" rx="6" class="cell"/><text x="415" y="249" font-size="17" class="" text-anchor="middle">[7,8]</text><rect x="41" y="290" width="78" height="36" rx="6" class="accent"/><text x="80" y="315" font-size="17" class="" text-anchor="middle">[2,2]</text><rect x="256" y="290" width="78" height="36" rx="6" class="accent"/><text x="295" y="315" font-size="17" class="" text-anchor="middle">[5,5]</text>
</svg>