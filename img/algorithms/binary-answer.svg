<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">把“可行”看成一个分界</title><desc id="desc">任务量3、6、7、11，限时8小时。速度3用10小时不可行，速度4用8小时可行；更快的速度也可行。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="270" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">把“可行”看成一个分界</text><text x="24" y="77" font-size="18" class="muted" text-anchor="start">任务量 [3,6,7,11]，限时 8 小时</text><rect x="45" y="104" width="118" height="87" rx="8" class="warm"/><text x="104" y="136" font-size="19" class="" text-anchor="middle">速度 3</text><text x="104" y="171" font-size="18" class="" text-anchor="middle">10 小时</text><rect x="181" y="104" width="118" height="87" rx="8" class="accent"/><text x="240" y="136" font-size="19" class="" text-anchor="middle">速度 4</text><text x="240" y="171" font-size="18" class="" text-anchor="middle">8 小时</text><rect x="317" y="104" width="118" height="87" rx="8" class="accent"/><text x="376" y="136" font-size="19" class="" text-anchor="middle">速度 5</text><text x="376" y="171" font-size="18" class="" text-anchor="middle">8 小时</text><text x="24" y="225" font-size="18" class="muted" text-anchor="start">速度 3 不可行；从速度 4 起都可行。</text>
</svg>