<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
<title id="title">更短的路线可以晚一点发现</title><desc id="desc">有向图0→1权8和3、0→2权1、2→1权1、1→3权0、2→3权7。确定顺序0、2、1、3，最终距离0、2、1、2，点4不可达。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="440" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">更短的路线可以晚一点发现</text><path d="M101.0,100.0 L287.0,100.0" class="route" marker-end="url(#arrow)"/><text x="185" y="82" font-size="18" class="" text-anchor="start">8 / 3</text><path d="M86.94499589071793,123.09365872205467 L137.13615827153453,220.12990599163345" class="route" marker-end="url(#arrow)"/><text x="82" y="188" font-size="18" class="" text-anchor="start">1</text><path d="M169.53028735969679,227.83702019905434 L293.96738284340347,118.48320901640301" class="route" marker-end="url(#arrow)"/><text x="239" y="180" font-size="18" class="" text-anchor="start">1</text><path d="M326.9449958907179,123.09365872205467 L377.13615827153455,220.12990599163345" class="route" marker-end="url(#arrow)"/><text x="370" y="167" font-size="18" class="" text-anchor="start">0</text><path d="M176.0,245.0 L362.0,245.0" class="route" marker-end="url(#arrow)"/><text x="270" y="232" font-size="18" class="" text-anchor="start">7</text><circle cx="75" cy="100" r="23" class="accent"/><text x="75" y="107" font-size="22" class="" text-anchor="middle">0</text><circle cx="315" cy="100" r="23" class="accent"/><text x="315" y="107" font-size="22" class="" text-anchor="middle">1</text><circle cx="150" cy="245" r="23" class="accent"/><text x="150" y="252" font-size="22" class="" text-anchor="middle">2</text><circle cx="390" cy="245" r="23" class="accent"/><text x="390" y="252" font-size="22" class="" text-anchor="middle">3</text><circle cx="55" cy="335" r="23" class="cell"/><text x="55" y="342" font-size="22" class="" text-anchor="middle">4</text><text x="92" y="342" font-size="18" class="" text-anchor="start">不可达 → INF</text><text x="24" y="386" font-size="18" class="muted" text-anchor="start">先到 2，再经 2 改进到 1 的距离：3 → 2。</text><text x="24" y="413" font-size="18" class="muted" text-anchor="start">最终：dist = [0, 2, 1, 2, INF]</text>
</svg>