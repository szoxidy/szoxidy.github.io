<svg xmlns="http://www.w3.org/2000/svg" width="480" height="355" viewBox="0 0 480 355" role="img" aria-labelledby="title desc">
<title id="title">修改 5，要更新哪些节点</title><desc id="desc">容量为16的树状数组，单点加5依次更新tree[5]、tree[6]、tree[8]、tree[16]，覆盖区间分别为[5,5]、[5,6]、[1,8]、[1,16]。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="355" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">修改 5，要更新哪些节点</text><text x="24" y="76" font-size="18" class="muted" text-anchor="start">以 n = 16 为例，每段都包含位置 5。</text><text x="24" y="129" font-size="17" class="" text-anchor="start">[5,5]</text><rect x="206" y="106" width="19" height="32" rx="4" class="accent"/><text x="24" y="181" font-size="17" class="" text-anchor="start">[5,6]</text><rect x="206" y="158" width="38" height="32" rx="4" class="accent"/><text x="24" y="233" font-size="17" class="" text-anchor="start">[1,8]</text><rect x="130" y="210" width="152" height="32" rx="4" class="accent"/><text x="24" y="285" font-size="17" class="" text-anchor="start">[1,16]</text><rect x="130" y="262" width="304" height="32" rx="4" class="accent"/><text x="24" y="330" font-size="18" class="muted" text-anchor="start">更新位置：5 → 6 → 8 → 16 → 32（越界停）</text>
</svg>