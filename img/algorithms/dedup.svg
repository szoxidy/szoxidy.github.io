<svg xmlns="http://www.w3.org/2000/svg" width="480" height="332" viewBox="0 0 480 332" role="img" aria-labelledby="title desc">
<title id="title">读到新值，再写入有效前缀</title><desc id="desc">数组1、1、2、2、2、4、4、5。read指向下标5的4，write指向下标2；将4写到2后，write前进，未读取的数据保持不动。最终有效前缀为1、2、4、5。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="332" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">读到新值，再写入有效前缀</text><text x="24" y="77" font-size="18" class="muted" text-anchor="start">先保留 1、2；read 现在读到下标 5 的 4。</text><rect x="38.0" y="96" width="47.0" height="38" rx="6" class="warm"/><text x="61.5" y="122" font-size="20" class="" text-anchor="middle">1</text><text x="61.5" y="154" font-size="15" class="muted" text-anchor="middle">0</text><rect x="89.0" y="96" width="47.0" height="38" rx="6" class="warm"/><text x="112.5" y="122" font-size="20" class="" text-anchor="middle">2</text><text x="112.5" y="154" font-size="15" class="muted" text-anchor="middle">1</text><rect x="140.0" y="96" width="47.0" height="38" rx="6" class="cell"/><text x="163.5" y="122" font-size="20" class="" text-anchor="middle">2</text><text x="163.5" y="154" font-size="15" class="muted" text-anchor="middle">2</text><rect x="191.0" y="96" width="47.0" height="38" rx="6" class="cell"/><text x="214.5" y="122" font-size="20" class="" text-anchor="middle">2</text><text x="214.5" y="154" font-size="15" class="muted" text-anchor="middle">3</text><rect x="242.0" y="96" width="47.0" height="38" rx="6" class="cell"/><text x="265.5" y="122" font-size="20" class="" text-anchor="middle">2</text><text x="265.5" y="154" font-size="15" class="muted" text-anchor="middle">4</text><rect x="293.0" y="96" width="47.0" height="38" rx="6" class="accent"/><text x="316.5" y="122" font-size="20" class="" text-anchor="middle">4</text><text x="316.5" y="154" font-size="15" class="muted" text-anchor="middle">5</text><rect x="344.0" y="96" width="47.0" height="38" rx="6" class="cell"/><text x="367.5" y="122" font-size="20" class="" text-anchor="middle">4</text><text x="367.5" y="154" font-size="15" class="muted" text-anchor="middle">6</text><rect x="395.0" y="96" width="47.0" height="38" rx="6" class="cell"/><text x="418.5" y="122" font-size="20" class="" text-anchor="middle">5</text><text x="418.5" y="154" font-size="15" class="muted" text-anchor="middle">7</text><path d="M316,167 Q260,213 163,167" class="route" marker-end="url(#arrow)"/><text x="240" y="215" font-size="18" class="" text-anchor="middle">把 4 写到 write = 2</text><rect x="110.0" y="239" width="62" height="38" rx="6" class="accent"/><text x="141.0" y="265" font-size="20" class="" text-anchor="middle">1</text><rect x="176.0" y="239" width="62" height="38" rx="6" class="accent"/><text x="207.0" y="265" font-size="20" class="" text-anchor="middle">2</text><rect x="242.0" y="239" width="62" height="38" rx="6" class="accent"/><text x="273.0" y="265" font-size="20" class="" text-anchor="middle">4</text><rect x="308.0" y="239" width="62" height="38" rx="6" class="accent"/><text x="339.0" y="265" font-size="20" class="" text-anchor="middle">5</text><text x="24" y="308" font-size="18" class="muted" text-anchor="start">遍历结束：有效区间 [0,4)，后半段不用读。</text>
</svg>