<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">两个前缀相减，留下中间一段</title><desc id="desc">数组为2、-1、3、5、4。prefix[1]=2、prefix[4]=9，相减得到下标[1,4)内的-1+3+5=7。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="340" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">两个前缀相减，留下中间一段</text><text x="24" y="80" font-size="19" class="" text-anchor="start">原数组（下标从 0 开始）</text><rect x="77.0" y="96" width="62" height="38" rx="6" class="cell"/><text x="108.0" y="122" font-size="20" class="" text-anchor="middle">2</text><text x="108.0" y="154" font-size="15" class="muted" text-anchor="middle">0</text><rect x="143.0" y="96" width="62" height="38" rx="6" class="accent"/><text x="174.0" y="122" font-size="20" class="" text-anchor="middle">-1</text><text x="174.0" y="154" font-size="15" class="muted" text-anchor="middle">1</text><rect x="209.0" y="96" width="62" height="38" rx="6" class="accent"/><text x="240.0" y="122" font-size="20" class="" text-anchor="middle">3</text><text x="240.0" y="154" font-size="15" class="muted" text-anchor="middle">2</text><rect x="275.0" y="96" width="62" height="38" rx="6" class="accent"/><text x="306.0" y="122" font-size="20" class="" text-anchor="middle">5</text><text x="306.0" y="154" font-size="15" class="muted" text-anchor="middle">3</text><rect x="341.0" y="96" width="62" height="38" rx="6" class="cell"/><text x="372.0" y="122" font-size="20" class="" text-anchor="middle">4</text><text x="372.0" y="154" font-size="15" class="muted" text-anchor="middle">4</text><text x="24" y="190" font-size="19" class="" text-anchor="start">prefix：前 i 个数的和</text><rect x="44.0" y="205" width="62" height="38" rx="6" class="cell"/><text x="75.0" y="231" font-size="20" class="" text-anchor="middle">0</text><text x="75.0" y="263" font-size="15" class="muted" text-anchor="middle">0</text><rect x="110.0" y="205" width="62" height="38" rx="6" class="accent"/><text x="141.0" y="231" font-size="20" class="" text-anchor="middle">2</text><text x="141.0" y="263" font-size="15" class="muted" text-anchor="middle">1</text><rect x="176.0" y="205" width="62" height="38" rx="6" class="cell"/><text x="207.0" y="231" font-size="20" class="" text-anchor="middle">1</text><text x="207.0" y="263" font-size="15" class="muted" text-anchor="middle">2</text><rect x="242.0" y="205" width="62" height="38" rx="6" class="cell"/><text x="273.0" y="231" font-size="20" class="" text-anchor="middle">4</text><text x="273.0" y="263" font-size="15" class="muted" text-anchor="middle">3</text><rect x="308.0" y="205" width="62" height="38" rx="6" class="accent"/><text x="339.0" y="231" font-size="20" class="" text-anchor="middle">9</text><text x="339.0" y="263" font-size="15" class="muted" text-anchor="middle">4</text><rect x="374.0" y="205" width="62" height="38" rx="6" class="cell"/><text x="405.0" y="231" font-size="20" class="" text-anchor="middle">13</text><text x="405.0" y="263" font-size="15" class="muted" text-anchor="middle">5</text><text x="24" y="308" font-size="18" class="muted" text-anchor="start">[1,4) 的和 = prefix[4] − prefix[1] = 9 − 2</text>
</svg>