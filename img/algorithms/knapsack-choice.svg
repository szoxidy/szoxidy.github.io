<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="title desc">
<title id="title">选 C 时，读上一行剩余容量</title><desc id="desc">容量6的背包，C重4价值7。只考虑A、B时容量2最优4，容量6最优9，因此考虑C后的容量6最优max(9,4+7)=11，选择A和C。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="330" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">选 C 时，读上一行剩余容量</text><text x="24" y="84" font-size="19" class="" text-anchor="start">上一行：只考虑 A、B</text><rect x="38.0" y="102" width="54.285714285714285" height="38" rx="6" class="cell"/><text x="65.14285714285714" y="128" font-size="20" class="" text-anchor="middle">0</text><text x="65.14285714285714" y="160" font-size="15" class="muted" text-anchor="middle">0</text><rect x="96.28571428571428" y="102" width="54.285714285714285" height="38" rx="6" class="cell"/><text x="123.42857142857143" y="128" font-size="20" class="" text-anchor="middle">0</text><text x="123.42857142857143" y="160" font-size="15" class="muted" text-anchor="middle">1</text><rect x="154.57142857142856" y="102" width="54.285714285714285" height="38" rx="6" class="accent"/><text x="181.71428571428572" y="128" font-size="20" class="" text-anchor="middle">4</text><text x="181.71428571428572" y="160" font-size="15" class="muted" text-anchor="middle">2</text><rect x="212.85714285714286" y="102" width="54.285714285714285" height="38" rx="6" class="cell"/><text x="240.0" y="128" font-size="20" class="" text-anchor="middle">5</text><text x="240.0" y="160" font-size="15" class="muted" text-anchor="middle">3</text><rect x="271.1428571428571" y="102" width="54.285714285714285" height="38" rx="6" class="cell"/><text x="298.2857142857143" y="128" font-size="20" class="" text-anchor="middle">5</text><text x="298.2857142857143" y="160" font-size="15" class="muted" text-anchor="middle">4</text><rect x="329.42857142857144" y="102" width="54.285714285714285" height="38" rx="6" class="cell"/><text x="356.57142857142856" y="128" font-size="20" class="" text-anchor="middle">9</text><text x="356.57142857142856" y="160" font-size="15" class="muted" text-anchor="middle">5</text><rect x="387.7142857142857" y="102" width="54.285714285714285" height="38" rx="6" class="warm"/><text x="414.85714285714283" y="128" font-size="20" class="" text-anchor="middle">9</text><text x="414.85714285714283" y="160" font-size="15" class="muted" text-anchor="middle">6</text><path d="M169,170 L392,223" class="route" marker-end="url(#arrow)"/><text x="235" y="202" font-size="18" class="" text-anchor="start">选 C：+7</text><text x="24" y="251" font-size="19" class="" text-anchor="start">当前行容量 6：</text><text x="240" y="251" font-size="19" class="heading" text-anchor="start">max(9, 4 + 7) = 11</text><text x="24" y="297" font-size="18" class="muted" text-anchor="start">不选 C 继承 9；选 C 后剩余容量为 2。</text>
</svg>