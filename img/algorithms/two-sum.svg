<svg xmlns="http://www.w3.org/2000/svg" width="480" height="354" viewBox="0 0 480 354" role="img" aria-labelledby="title desc">
<title id="title">哪一端已经不可能参与答案</title><desc id="desc">有序数组1、2、4、6、10，目标8。先排除右端10，再排除左端1，最终2+6=8，返回下标1和3。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="354" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">哪一端已经不可能参与答案</text><text x="24" y="74" font-size="19" class="" text-anchor="start">① 1 + 10 &gt; 8，排除右端 10</text><rect x="77.0" y="91" width="62" height="38" rx="6" class="accent"/><text x="108.0" y="117" font-size="20" class="" text-anchor="middle">1</text><rect x="143.0" y="91" width="62" height="38" rx="6" class="cell"/><text x="174.0" y="117" font-size="20" class="" text-anchor="middle">2</text><rect x="209.0" y="91" width="62" height="38" rx="6" class="cell"/><text x="240.0" y="117" font-size="20" class="" text-anchor="middle">4</text><rect x="275.0" y="91" width="62" height="38" rx="6" class="cell"/><text x="306.0" y="117" font-size="20" class="" text-anchor="middle">6</text><rect x="341.0" y="91" width="62" height="38" rx="6" class="accent"/><text x="372.0" y="117" font-size="20" class="" text-anchor="middle">10</text><text x="24" y="165" font-size="19" class="" text-anchor="start">② 1 + 6 &lt; 8，排除左端 1</text><rect x="77.0" y="182" width="62" height="38" rx="6" class="accent"/><text x="108.0" y="208" font-size="20" class="" text-anchor="middle">1</text><rect x="143.0" y="182" width="62" height="38" rx="6" class="cell"/><text x="174.0" y="208" font-size="20" class="" text-anchor="middle">2</text><rect x="209.0" y="182" width="62" height="38" rx="6" class="cell"/><text x="240.0" y="208" font-size="20" class="" text-anchor="middle">4</text><rect x="275.0" y="182" width="62" height="38" rx="6" class="accent"/><text x="306.0" y="208" font-size="20" class="" text-anchor="middle">6</text><rect x="341.0" y="182" width="62" height="38" rx="6" class="cell"/><text x="372.0" y="208" font-size="20" class="" text-anchor="middle">10</text><text x="24" y="256" font-size="19" class="" text-anchor="start">③ 2 + 6 = 8，返回 (1,3)</text><rect x="77.0" y="273" width="62" height="38" rx="6" class="cell"/><text x="108.0" y="299" font-size="20" class="" text-anchor="middle">1</text><rect x="143.0" y="273" width="62" height="38" rx="6" class="accent"/><text x="174.0" y="299" font-size="20" class="" text-anchor="middle">2</text><rect x="209.0" y="273" width="62" height="38" rx="6" class="cell"/><text x="240.0" y="299" font-size="20" class="" text-anchor="middle">4</text><rect x="275.0" y="273" width="62" height="38" rx="6" class="accent"/><text x="306.0" y="299" font-size="20" class="" text-anchor="middle">6</text><rect x="341.0" y="273" width="62" height="38" rx="6" class="cell"/><text x="372.0" y="299" font-size="20" class="" text-anchor="middle">10</text>
</svg>