<svg xmlns="http://www.w3.org/2000/svg" width="480" height="288" viewBox="0 0 480 288" role="img" aria-labelledby="title desc">
<title id="title">允许一个新的中转点</title><desc id="desc">直接边0到2权9；经过点1的两条边权4和2，总距离6。Floyd在允许点1中转时把0到2更新为6。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="288" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">允许一个新的中转点</text><path d="M85,110 L238,110" class="route" marker-end="url(#arrow)"/><path d="M268,110 L417,110" class="route" marker-end="url(#arrow)"/><circle cx="60" cy="110" r="23" class="accent"/><text x="60" y="117" font-size="22" class="" text-anchor="middle">0</text><circle cx="250" cy="110" r="23" class="accent"/><text x="250" y="117" font-size="22" class="" text-anchor="middle">1</text><circle cx="440" cy="110" r="23" class="accent"/><text x="440" y="117" font-size="22" class="" text-anchor="middle">2</text><text x="150" y="94" font-size="19" class="" text-anchor="start">4</text><text x="338" y="94" font-size="19" class="" text-anchor="start">2</text><path d="M60,137 Q250,232 430,139" class="edge" marker-end="url(#arrow)"/><text x="240" y="198" font-size="19" class="" text-anchor="middle">直接边 9</text><text x="24" y="253" font-size="18" class="muted" text-anchor="start">d[0][2] = min(9, 4 + 2) = 6</text>
</svg>