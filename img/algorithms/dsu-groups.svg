<svg xmlns="http://www.w3.org/2000/svg" width="480" height="405" viewBox="0 0 480 405" role="img" aria-labelledby="title desc">
<title id="title">集合代表与路径压缩</title><desc id="desc">合并0、1及1、2，得到集合{0,1,2}、{3}、{4}、{5}共4组。另一棵查询前路径3→2→0，压缩后3和2均直接指向0。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="405" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">集合代表与路径压缩</text><rect x="24" y="67" width="210" height="75" rx="8" class="accent"/><text x="129" y="112" font-size="24" class="" text-anchor="middle">{ 0, 1, 2 }</text><circle cx="270" cy="104" r="23" class="cell"/><text x="270" y="111" font-size="22" class="" text-anchor="middle">3</text><circle cx="340" cy="104" r="23" class="cell"/><text x="340" y="111" font-size="22" class="" text-anchor="middle">4</text><circle cx="410" cy="104" r="23" class="cell"/><text x="410" y="111" font-size="22" class="" text-anchor="middle">5</text><text x="24" y="173" font-size="18" class="muted" text-anchor="start">合并成功两次：6 个分量 → 4 个分量</text><text x="24" y="220" font-size="19" class="" text-anchor="start">查询前</text><text x="24" y="309" font-size="19" class="" text-anchor="start">查询后</text><circle cx="155" cy="215" r="23" class="cell"/><text x="155" y="222" font-size="22" class="" text-anchor="middle">3</text><circle cx="155" cy="310" r="23" class="accent"/><text x="155" y="317" font-size="22" class="" text-anchor="middle">3</text><circle cx="265" cy="215" r="23" class="cell"/><text x="265" y="222" font-size="22" class="" text-anchor="middle">2</text><circle cx="265" cy="310" r="23" class="accent"/><text x="265" y="317" font-size="22" class="" text-anchor="middle">2</text><circle cx="375" cy="215" r="23" class="cell"/><text x="375" y="222" font-size="22" class="" text-anchor="middle">0</text><circle cx="375" cy="310" r="23" class="accent"/><text x="375" y="317" font-size="22" class="" text-anchor="middle">0</text><path d="M180,215 L238,215" class="edge" marker-end="url(#arrow)"/><path d="M290,215 L348,215" class="edge" marker-end="url(#arrow)"/><path d="M290,310 L348,310" class="edge" marker-end="url(#arrow)"/><path d="M155,285 Q265,240 367,283" class="route" marker-end="url(#arrow)"/><text x="24" y="379" font-size="18" class="muted" text-anchor="start">指向根的路径变短，集合中的成员没有变。</text>
</svg>