<svg xmlns="http://www.w3.org/2000/svg" width="480" height="410" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
<title id="title">找第一个 ≥ 3 的位置</title><desc id="desc">在1、3、3、3、8中用半开区间查找：区间从[0,5)变为[0,2)、[0,1)，最终停在下标1。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="410" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">找第一个 ≥ 3 的位置</text><text x="24" y="70" font-size="19" class="" text-anchor="start">① [0,5)，mid = 2 → right = 2</text><rect x="77.0" y="82" width="62" height="38" rx="6" class="cell"/><text x="108.0" y="108" font-size="20" class="" text-anchor="middle">1</text><text x="108.0" y="140" font-size="15" class="muted" text-anchor="middle">0</text><rect x="143.0" y="82" width="62" height="38" rx="6" class="cell"/><text x="174.0" y="108" font-size="20" class="" text-anchor="middle">3</text><text x="174.0" y="140" font-size="15" class="muted" text-anchor="middle">1</text><rect x="209.0" y="82" width="62" height="38" rx="6" class="accent"/><text x="240.0" y="108" font-size="20" class="" text-anchor="middle">3</text><text x="240.0" y="140" font-size="15" class="muted" text-anchor="middle">2</text><rect x="275.0" y="82" width="62" height="38" rx="6" class="cell"/><text x="306.0" y="108" font-size="20" class="" text-anchor="middle">3</text><text x="306.0" y="140" font-size="15" class="muted" text-anchor="middle">3</text><rect x="341.0" y="82" width="62" height="38" rx="6" class="cell"/><text x="372.0" y="108" font-size="20" class="" text-anchor="middle">8</text><text x="372.0" y="140" font-size="15" class="muted" text-anchor="middle">4</text><text x="24" y="164" font-size="19" class="" text-anchor="start">② [0,2)，mid = 1 → right = 1</text><rect x="77.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="108.0" y="202" font-size="20" class="" text-anchor="middle">1</text><text x="108.0" y="234" font-size="15" class="muted" text-anchor="middle">0</text><rect x="143.0" y="176" width="62" height="38" rx="6" class="accent"/><text x="174.0" y="202" font-size="20" class="" text-anchor="middle">3</text><text x="174.0" y="234" font-size="15" class="muted" text-anchor="middle">1</text><rect x="209.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="240.0" y="202" font-size="20" class="" text-anchor="middle">3</text><text x="240.0" y="234" font-size="15" class="muted" text-anchor="middle">2</text><rect x="275.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="306.0" y="202" font-size="20" class="" text-anchor="middle">3</text><text x="306.0" y="234" font-size="15" class="muted" text-anchor="middle">3</text><rect x="341.0" y="176" width="62" height="38" rx="6" class="cell"/><text x="372.0" y="202" font-size="20" class="" text-anchor="middle">8</text><text x="372.0" y="234" font-size="15" class="muted" text-anchor="middle">4</text><text x="24" y="258" font-size="19" class="" text-anchor="start">③ [0,1)，mid = 0 → left = 1</text><rect x="77.0" y="270" width="62" height="38" rx="6" class="accent"/><text x="108.0" y="296" font-size="20" class="" text-anchor="middle">1</text><text x="108.0" y="328" font-size="15" class="muted" text-anchor="middle">0</text><rect x="143.0" y="270" width="62" height="38" rx="6" class="cell"/><text x="174.0" y="296" font-size="20" class="" text-anchor="middle">3</text><text x="174.0" y="328" font-size="15" class="muted" text-anchor="middle">1</text><rect x="209.0" y="270" width="62" height="38" rx="6" class="cell"/><text x="240.0" y="296" font-size="20" class="" text-anchor="middle">3</text><text x="240.0" y="328" font-size="15" class="muted" text-anchor="middle">2</text><rect x="275.0" y="270" width="62" height="38" rx="6" class="cell"/><text x="306.0" y="296" font-size="20" class="" text-anchor="middle">3</text><text x="306.0" y="328" font-size="15" class="muted" text-anchor="middle">3</text><rect x="341.0" y="270" width="62" height="38" rx="6" class="cell"/><text x="372.0" y="296" font-size="20" class="" text-anchor="middle">8</text><text x="372.0" y="328" font-size="15" class="muted" text-anchor="middle">4</text><text x="24" y="378" font-size="18" class="muted" text-anchor="start">边界重合在 1；相等时仍要继续向左找。</text>
</svg>