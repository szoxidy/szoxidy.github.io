<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
<title id="title">一棵树，三层节点</title><desc id="desc">根为8，左子树含3、1、6，右子树含10、14。根深度0，叶节点深度2。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="360" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">一棵树，三层节点</text><path d="M240,90 L125,180" class="edge"/><path d="M240,90 L355,180" class="edge"/><path d="M125,180 L70,270" class="edge"/><path d="M125,180 L180,270" class="edge"/><path d="M355,180 L410,270" class="edge"/><circle cx="240" cy="90" r="23" class="cell"/><text x="240" y="97" font-size="22" class="" text-anchor="middle">8</text><circle cx="125" cy="180" r="23" class="accent"/><text x="125" y="187" font-size="22" class="" text-anchor="middle">3</text><circle cx="355" cy="180" r="23" class="cell"/><text x="355" y="187" font-size="22" class="" text-anchor="middle">10</text><circle cx="70" cy="270" r="23" class="accent"/><text x="70" y="277" font-size="22" class="" text-anchor="middle">1</text><circle cx="180" cy="270" r="23" class="accent"/><text x="180" y="277" font-size="22" class="" text-anchor="middle">6</text><circle cx="410" cy="270" r="23" class="cell"/><text x="410" y="277" font-size="22" class="" text-anchor="middle">14</text><text x="24" y="97" font-size="16" class="muted" text-anchor="start">深度 0</text><text x="24" y="187" font-size="16" class="muted" text-anchor="start">深度 1</text><text x="24" y="330" font-size="18" class="muted" text-anchor="start">青色部分是 8 的左子树；高度按边数为 2。</text>
</svg>