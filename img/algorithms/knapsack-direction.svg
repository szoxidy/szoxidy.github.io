<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
<title id="title">倒着更新，才能只用一次</title><desc id="desc">唯一物品重2价值3，容量4。倒序先更新dp[4]读取旧dp[2]=0，结果3；正序先更新dp[2]=3，再更新dp[4]得到6，重复使用了物品。</desc>
<style>
:root{--paper:#f4f8f7;--ink:#29454d;--muted:#61767c;--cell:#fff;--stroke:#cadbdc;--accent:#d7eeed;--warm:#f5e7cd;--teal:#237d87;--amber:#ad7621}
@media(prefers-color-scheme:dark){:root{--paper:#26353e;--ink:#e3eeed;--muted:#adc1c5;--cell:#31454e;--stroke:#526c74;--accent:#365b62;--warm:#615239;--teal:#84c4cb;--amber:#deb974}}
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}
.heading{font-weight:600}.muted{fill:var(--muted)}.cell{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5}.accent{fill:var(--accent);stroke:var(--teal);stroke-width:1.6}.warm{fill:var(--warm);stroke:var(--amber);stroke-width:1.6}.edge{fill:none;stroke:var(--stroke);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wall{fill:var(--stroke)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--teal)"/></marker></defs>
<rect width="480" height="360" rx="14" fill="var(--paper)"/>
<text x="24" y="38" font-size="22" class="heading" text-anchor="start">倒着更新，才能只用一次</text><text x="24" y="77" font-size="18" class="muted" text-anchor="start">唯一物品：重量 2，价值 3；容量 4。</text><text x="24" y="126" font-size="19" class="" text-anchor="start">倒序：先写 dp[4]，读旧的 dp[2]</text><rect x="77.0" y="144" width="62" height="38" rx="6" class="cell"/><text x="108.0" y="170" font-size="20" class="" text-anchor="middle">0</text><text x="108.0" y="202" font-size="15" class="muted" text-anchor="middle">0</text><rect x="143.0" y="144" width="62" height="38" rx="6" class="cell"/><text x="174.0" y="170" font-size="20" class="" text-anchor="middle">0</text><text x="174.0" y="202" font-size="15" class="muted" text-anchor="middle">1</text><rect x="209.0" y="144" width="62" height="38" rx="6" class="warm"/><text x="240.0" y="170" font-size="20" class="" text-anchor="middle">0</text><text x="240.0" y="202" font-size="15" class="muted" text-anchor="middle">2</text><rect x="275.0" y="144" width="62" height="38" rx="6" class="cell"/><text x="306.0" y="170" font-size="20" class="" text-anchor="middle">0</text><text x="306.0" y="202" font-size="15" class="muted" text-anchor="middle">3</text><rect x="341.0" y="144" width="62" height="38" rx="6" class="accent"/><text x="372.0" y="170" font-size="20" class="" text-anchor="middle">3</text><text x="372.0" y="202" font-size="15" class="muted" text-anchor="middle">4</text><text x="24" y="243" font-size="19" class="" text-anchor="start">正序：读到本轮刚写出的 dp[2]</text><rect x="77.0" y="261" width="62" height="38" rx="6" class="cell"/><text x="108.0" y="287" font-size="20" class="" text-anchor="middle">0</text><text x="108.0" y="319" font-size="15" class="muted" text-anchor="middle">0</text><rect x="143.0" y="261" width="62" height="38" rx="6" class="cell"/><text x="174.0" y="287" font-size="20" class="" text-anchor="middle">0</text><text x="174.0" y="319" font-size="15" class="muted" text-anchor="middle">1</text><rect x="209.0" y="261" width="62" height="38" rx="6" class="accent"/><text x="240.0" y="287" font-size="20" class="" text-anchor="middle">3</text><text x="240.0" y="319" font-size="15" class="muted" text-anchor="middle">2</text><rect x="275.0" y="261" width="62" height="38" rx="6" class="cell"/><text x="306.0" y="287" font-size="20" class="" text-anchor="middle">3</text><text x="306.0" y="319" font-size="15" class="muted" text-anchor="middle">3</text><rect x="341.0" y="261" width="62" height="38" rx="6" class="warm"/><text x="372.0" y="287" font-size="20" class="" text-anchor="middle">6</text><text x="372.0" y="319" font-size="15" class="muted" text-anchor="middle">4</text>
</svg>